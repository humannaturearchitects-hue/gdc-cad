<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2b3038" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GDC" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>GDC GOOD DESIGN CAD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8732a'/%3E%3Ctext x='16' y='21' font-family='Arial,sans-serif' font-weight='700' font-size='11' fill='white' text-anchor='middle'%3EGDC%3C/text%3E%3C/svg%3E" />
  <script type="module" crossorigin src="./assets/index-BlJgXXQr.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DJVjw-LY.css">
</head>
<body>
<div id="boot-msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font:15px -apple-system,'Hiragino Sans',sans-serif;color:#2b3038;background:#eef1f5;z-index:9999;padding:20px;text-align:center">
  <div style="background:#e8732a;color:#fff;font-weight:700;border-radius:8px;padding:6px 10px">GDC</div>
  <div id="boot-text">起動しています…</div>
</div>
<script>
  // 白い画面のまま止まらないように: 読み込みに失敗したら理由を表示する
  (function () {
    var shown = false;
    function fail(msg) {
      if (shown) return; shown = true;
      var el = document.getElementById("boot-text");
      if (!el) return;
      el.innerHTML = "起動できませんでした。<br><small style='color:#666'>" + String(msg).replace(/[<>&]/g, "") +
        "<br><br>・iPhone は iOS 16 以降、Safari の最新版で開いてください<br>・公開するときは「web公開用（iPhone用）」フォルダの<b>中身</b>（index.html と assets など）を置いてください<br><br>" +
        navigator.userAgent.replace(/[<>&]/g, "") + "</small>";
    }
    window.addEventListener("error", function (e) { if (!window.__app) fail((e.message || "読み込みエラー") + (e.filename ? " (" + e.filename.split("/").pop() + ")" : "")); }, true);
    window.addEventListener("unhandledrejection", function (e) { if (!window.__app) fail(e.reason && e.reason.message || "読み込みエラー"); });
    setTimeout(function () { if (!window.__app) fail("40 秒たっても起動しませんでした（通信が遅いか、ファイルが足りません）"); }, 40000);
  })();
</script>
<div id="app">
  <header id="topbar">
    <div class="tb-row1">
      <button class="icon-btn mobile-only" id="btn-browser" title="部品ツリー">☰</button>
      <div class="brand"><span class="logo">GDC</span><span class="brand-name">GDC GOOD DESIGN CAD</span></div>
      <div class="menu" id="menu-file"><button class="menu-btn">ファイル ▾</button><div class="menu-pop"></div></div>
      <button class="icon-btn" id="btn-undo" title="元に戻す (Ctrl+Z)">↶</button>
      <button class="icon-btn" id="btn-redo" title="やり直し (Ctrl+Y)">↷</button>
      <div class="doc-title" id="doc-title">無題</div>
      <div class="ws-switch">
        <button class="ws active" data-ws="design">デザイン</button>
        <button class="ws" data-ws="drawing">図面</button>
      </div>
    </div>
    <div class="tb-tabs" id="tabs"></div>
    <div class="tb-tools" id="tools"></div>
  </header>
  <main id="main">
    <aside id="browser"></aside>
    <section id="viewport">
      <canvas id="view3d"></canvas>
      <div id="overlay"></div>
      <div id="viewcube"></div>
      <div id="navbar">
        <button data-nav="home" title="ホーム表示">⌂</button>
        <button data-nav="fit" title="全体表示 (F)">⤢</button>
        <button data-nav="grid" title="グリッド表示">#</button>
        <button data-nav="edges" title="エッジ表示">◫</button>
      </div>
      <div id="welcome" class="hidden">
        <h2>GDC GOOD DESIGN CAD へようこそ</h2>
        <p>① 上の <b>「スケッチ作成」</b><span class="kbd-hint">（S キー）</span>→ 平面をクリック → 長方形や円を描く</p>
        <p>② <b>「押し出し」</b><span class="kbd-hint">（E キー）</span>で立体に</p>
        <p>③ 下の<b>タイムライン</b>をダブルクリックすると、後から寸法を変えられます</p>
        <p class="sub">既存データは「ファイル → インポート」（STEP / STL）。<br>操作に迷ったら<span class="kbd-hint"> <b>F1</b> で</span>「ファイル → 操作ガイド」、「ファイル → サンプルを開く」で見本を確認できます。</p>
      </div>
      <div id="dialog" class="hidden"></div>
      <div id="busy" class="hidden"><span class="spin"></span><span id="busy-msg">計算中…</span></div>
    </section>
    <section id="drawing-ws" class="hidden"></section>
  </main>
  <footer id="timeline"></footer>
  <div id="statusbar"><span id="status-hint">準備完了</span><span id="status-coord"></span></div>
  <div id="ctxmenu" class="hidden"></div>
  <div id="toast"></div>
  <input type="file" id="file-input" class="hidden" />
</div>
</body>
</html>
